<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share Full Catalogue | FMM CLASSICO</title>
<style>
:root{--navy:#073451;--blue:#0878b9;--pale:#f1f8fc;--line:#d8e6ed;--ink:#243746}
*{box-sizing:border-box}body{margin:0;background:#f5f8fa;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{background:#fff;border-top:8px solid var(--blue);padding:22px max(18px,calc((100% - 1100px)/2));box-shadow:0 2px 10px #07345112}
h1{margin:0;color:var(--navy);font-size:26px}header p{margin:7px 0 0;color:#637783;line-height:1.5}
main{max-width:1100px;margin:24px auto;padding:0 16px 40px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
button,.btn{border:0;border-radius:8px;padding:12px 16px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.secondary{background:#fff;color:var(--blue);border:1px solid var(--line)}
#status{font-size:13px;color:#637783}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center}
.photo{width:100px;height:116px;object-fit:contain;background:#f7fafc;border-radius:8px;border:1px solid #edf2f5}
.name{font-size:16px;font-weight:800;color:var(--navy);line-height:1.25;margin:2px 0 7px}
.price{font-size:18px;font-weight:800;color:var(--blue)}
.empty{background:#fff;border:1px solid var(--line);padding:22px;border-radius:12px;color:#637783}
@media(max-width:420px){.card{grid-template-columns:86px 1fr;padding:10px;gap:10px}.photo{width:86px;height:104px}}
</style></head>
<body>
<header><h1>FMM CLASSICO — Full Catalogue Sharing</h1><p>Share all available products together in one WhatsApp message. Customers open one catalogue link to browse every product, view its pictures and details, and order individually.</p></header>
<main>
<div class="toolbar"><button class="secondary" id="back">Back to Admin</button><button id="shareAll">Share Full Catalogue on WhatsApp</button><button class="secondary" id="copyLink">Copy Catalogue Link</button><span id="status">Loading available products…</span></div>
<div class="grid" id="products"></div>
</main>
<script>
const SITE='https://products.fmmclassico.com';
const CATALOGUE=SITE+'/catalogue';
const $=id=>document.getElementById(id);
let products=[];
function shareCatalogue(){
 const message='FMM CLASSICO | PHONE ACCESSORIES\nYour Trusted Destination For Quality Products.\n\nBrowse our full catalogue to see all available products, pictures, prices and details. Open any product to view more information and place your order.\n\n'+CATALOGUE;
 const url='https://wa.me/?text='+encodeURIComponent(message);
 window.open(url,'_blank','noopener');
 $('status').textContent='WhatsApp opened with one full-catalogue message.';
}
async function copyLink(){
 try{await navigator.clipboard.writeText(CATALOGUE);$('status').textContent='Full catalogue link copied.'}
 catch{$('status').textContent='Copy this catalogue link: '+CATALOGUE;prompt('Copy catalogue link',CATALOGUE)}
}
function render(){
 const root=$('products');root.replaceChildren();
 const available=products.filter(p=>p.visible!==false);
 if(!available.length){root.innerHTML='<div class="empty">No available products are currently listed.</div>';return}
 available.forEach(p=>{
  const card=document.createElement('article');card.className='card';
  const image=document.createElement('img');image.className='photo';image.alt=p.name||'Product';image.loading='lazy';image.src=(Array.isArray(p.images)&&p.images[0])||p.image||'';
  const info=document.createElement('div'),name=document.createElement('div'),price=document.createElement('div');
  name.className='name';name.textContent=p.name||'Product';
  price.className='price';price.textContent='GH₵ '+(p.price||'—');
  info.append(name,price);card.append(image,info);root.append(card);
 });
 $('status').textContent=available.length+' available products included in the full catalogue.';
}
$('back').onclick=()=>location.href='/admin.html';
$('shareAll').onclick=shareCatalogue;
$('copyLink').onclick=copyLink;
fetch('/api/catalogue',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Could not load catalogue');return r.json()}).then(data=>{products=data.products||[];render()}).catch(e=>{$('status').textContent=e.message});
</script></body></html>
