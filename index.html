;object-fit:contain}.hero{margin:0 12px 18px}.intro{padding:0 18px 16px}.products{grid-template-columns:minmax(0,1fr);padding:0 12px 20px;gap:12px}.product{grid-template-columns:minmax(120px,32%) minmax(0,1fr);padding:10px;gap:12px}.product-main-image,.product-gallery>.empty{height:165px}.product-thumb{width:48px;height:48px}.product p{font-size:13px;line-height:1.65}.description-list{padding-left:19px}header{padding:20px 18px}.product-video{max-height:230px}}
</style></head><body><main class="wrap"><div class="top"></div><header><p class="brand" id="brand"></p><p class="tag" id="tag"></p></header><section class="hero"><div class="slides" id="slides"></div><div class="dots" id="dots"></div></section><section class="intro"><h2 id="ctitle"></h2><p id="cintro"></p></section><section class="products" id="products"></section><footer class="footer"><b id="ftitle"></b><p id="slogan"></p><p id="wa"></p><p id="loc"></p><p id="extraFooter" style="white-space:pre-line"></p><p id="social"></p></footer></main>
<script>
const DEFAULTS={"brand":"FMM CLASSICO","tagline":"PHONE ACCESSORIES • QUALITY • AFFORDABILITY","edition":"FMM CLASSICO PHONE ACCESSORIES","heroTitle":"DISCOVER OUR PHONE ACCESSORIES","heroText":"Our latest phone accessories. Quality products at affordable prices.","catalogueTitle":"Our Phone Accessories","catalogueIntro":"Browse our catalogue and order directly on WhatsApp.","footerTitle":"FMM CLASSICO","footerSlogan":"QUALITY PRODUCTS. AFFORDABLE PRICES.","footerExtraLine":"","whatsapp":"233599676419","location":"","social":"","shareTitle":"FMM CLASSICO | Phone Accessories","shareDescription":"Discover quality phone accessories at affordable prices. Browse the catalogue and order directly on WhatsApp.","shareImageUrl":"","banners":[{"id":"default-banner","title":"DISCOVER OUR PHONE ACCESSORIES","text":"Our latest phone accessories. Quality products at affordable prices.","image":""}],"products":[]};
let S=DEFAULTS;const $=id=>document.getElementById(id);
function renderDescription(target,raw){target.replaceChildren();const lines=String(raw||'').replace(/\r\n?/g,'\n').split('\n');let paragraph=[];let list=null;const flushParagraph=()=>{if(paragraph.length){const p=document.createElement('p');p.className='description-paragraph';p.textContent=paragraph.join(' ').trim();target.append(p);paragraph=[]}};const flushList=()=>{if(list){target.append(list);list=null}};for(const line of lines){const t=line.trim();if(!t){flushParagraph();flushList();continue}if(/^[-•]\s+/.test(t)){flushParagraph();if(!list){list=document.createElement('ul');list.className='description-list'}const li=document.createElement('li');li.textContent=t.replace(/^[-•]\s+/,'');list.append(li)}else{flushList();paragraph.push(t)}}flushParagraph();flushList()}
function render(){ $('brand').textContent=S.brand||'';$('tag').textContent=S.tagline||'';$('ctitle').textContent=S.catalogueTitle||'';$('cintro').textContent=S.catalogueIntro||'';$('ftitle').textContent=S.footerTitle||S.brand;$('slogan').textContent=S.footerSlogan||'';$('wa').textContent='WhatsApp: Choose Fedra (Accra & UMaT) or Wilfred (UMaT Main Campus – Campcity)';$('loc').textContent=S.location?'Location: '+S.location:'';$('extraFooter').textContent=S.footerExtraLine||'';$('social').textContent=S.social||'';
 const slides=$('slides'),dots=$('dots');slides.innerHTML='';dots.innerHTML='';const banners=S.banners?.length?S.banners:[{title:S.heroTitle,text:S.heroText}];
 banners.forEach((b,i)=>{const el=document.createElement('article');el.className='slide';const copy=document.createElement('div'),ed=document.createElement('div'),h=document.createElement('h1'),p=document.createElement('p');ed.className='edition';ed.textContent=S.edition||'';h.textContent=b.title||S.heroTitle||'';p.textContent=b.text||S.heroText||'';copy.append(ed,h,p);el.append(copy);if(b.image){const im=document.createElement('img');im.src=b.image;im.alt=b.title||'Phone accessories';im.loading=i?'lazy':'eager';im.decoding='async';if(i===0)im.fetchPriority='high';el.append(im)}slides.append(el);const dot=document.createElement('button');dot.type='button';dot.setAttribute('aria-label','Show banner '+(i+1));dot.onclick=()=>el.scrollIntoView({behavior:'smooth',inline:'start'});dots.append(dot)});
 const root=$('products');root.innerHTML='';(S.products||[]).filter(p=>p.visible!==false).forEach((p)=>{const card=document.createElement('article');card.className='product';card.dataset.productId=p.id||'';const imageUrls=Array.isArray(p.images)&&p.images.length?p.images.filter(Boolean):[p.image||(p.media?.[0]?.data)||''].filter(Boolean);const gallery=document.createElement('div');gallery.className='product-gallery';if(imageUrls.length){const main=document.createElement('img');main.className='product-main-image';main.src=imageUrls[0];main.alt=(p.name||'Phone accessory')+' image 1';main.loading='lazy';main.decoding='async';main.fetchPriority='low';const imageLink=document.createElement('a');imageLink.className='product-image-link';imageLink.href='/product/'+encodeURIComponent(p.id||'');imageLink.setAttribute('aria-label','View all details for '+(p.name||'this product'));imageLink.append(main);gallery.append(imageLink);if(imageUrls.length>1){const thumbs=document.createElement('div');thumbs.className='product-thumbs';imageUrls.forEach((url,n)=>{const thumb=document.createElement('img');thumb.className='product-thumb';thumb.src=url;thumb.alt=(p.name||'Phone accessory')+' image '+(n+1);thumb.loading='lazy';thumb.decoding='async';thumb.setAttribute('role','button');thumb.setAttribute('tabindex','0');thumb.setAttribute('aria-pressed',n===0?'true':'false');const selectImage=()=>{main.src=url;main.alt=(p.name||'Phone accessory')+' image '+(n+1);thumbs.querySelectorAll('.product-thumb').forEach(t=>t.setAttribute('aria-pressed','false'));thumb.setAttribute('aria-pressed','true')};thumb.addEventListener('click',selectImage);thumb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectImage()}});thumbs.append(thumb)});gallery.append(thumbs)}}else{const ph=document.createElement('div');ph.className='empty';ph.textContent='PRODUCT IMAGE';gallery.append(ph)}card.append(gallery);if(p.video){const v=document.createElement('video');v.src=p.video;v.controls=true;v.preload='none';v.playsInline=true;v.loading='lazy';v.className='product-video';v.setAttribute('aria-label',(p.name||'Product')+' video');card.append(v)}const c=document.createElement('div'),h=document.createElement('h3'),short=document.createElement('p'),details=document.createElement('details'),summary=document.createElement('summary'),full=document.createElement('p'),price=document.createElement('div'),a=document.createElement('a');const titleLink=document.createElement('a');titleLink.className='product-title-link';titleLink.href='/product/'+encodeURIComponent(p.id||'');titleLink.textContent=p.name||'Phone accessory';h.append(titleLink);short.textContent=p.shortDescription||p.description||'';summary.textContent='View full description';full.className='full';renderDescription(full,p.description||'');details.append(summary,full);price.className='price';price.textContent='GH₵ '+(p.price||'0.00');a.className='order';a.textContent='ORDER ON WHATSAPP';a.href='/whatsapp.html?productId='+encodeURIComponent(p.id||'')+'&product='+encodeURIComponent(p.name||'this product')+'&price='+encodeURIComponent(p.price||'');a.target='_blank';a.rel='noopener';c.append(h,short,details,price,a);card.append(c);root.append(card)});
 if(!S.products?.length){const msg=document.createElement('p');msg.className='empty';msg.textContent='Products will be displayed here. Please check back soon.';root.append(msg)}const requestedProduct=new URLSearchParams(location.search).get('product');if(requestedProduct){const target=Array.from(root.querySelectorAll('.product')).find(card=>card.dataset.productId===requestedProduct);if(target){target.scrollIntoView({behavior:'smooth',block:'center'});target.style.outline='3px solid #0878b9';target.style.outlineOffset='3px';const description=target.querySelector('details');if(description)description.open=true;}}}
(async()=>{try{const r=await fetch('/api/catalogue',{cache:'no-store'});if(r.ok)S={...DEFAULTS,...await r.json()}}catch(e){console.warn(e)}render()})();
</script></body></html>
