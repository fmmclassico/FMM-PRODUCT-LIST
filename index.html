<script>
const DEFAULTS={"brand":"FMM CLASSICO","tagline":"PHONE ACCESSORIES • QUALITY • AFFORDABILITY","edition":"FMM CLASSICO PHONE ACCESSORIES","heroTitle":"DISCOVER OUR PHONE ACCESSORIES","heroText":"Our latest phone accessories. Quality products at affordable prices.","catalogueTitle":"Our Phone Accessories","catalogueIntro":"Browse our catalogue and order directly on WhatsApp.","footerTitle":"FMM CLASSICO","footerSlogan":"QUALITY PRODUCTS. AFFORDABLE PRICES.","whatsapp":"233599676419","location":"","social":"","shareTitle":"FMM CLASSICO | Phone Accessories","shareDescription":"Discover quality phone accessories at affordable prices. Browse the catalogue and order directly on WhatsApp.","shareImageUrl":"","banners":[{"id":"default-banner","title":"DISCOVER OUR PHONE ACCESSORIES","text":"Our latest phone accessories. Quality products at affordable prices.","image":""}],"products":[]};
let S=DEFAULTS;const $=id=>document.getElementById(id);
function render(){ $('brand').textContent=S.brand||'';$('tag').textContent=S.tagline||'';$('ctitle').textContent=S.catalogueTitle||'';$('cintro').textContent=S.catalogueIntro||'';$('ftitle').textContent=S.footerTitle||S.brand;$('slogan').textContent=S.footerSlogan||'';$('wa').textContent=S.whatsapp?'WhatsApp: +'+S.whatsapp:'';$('loc').textContent=S.location?'Location: '+S.location:'';$('social').textContent=S.social||'';
 const slides=$('slides'),dots=$('dots');slides.innerHTML='';dots.innerHTML='';const banners=S.banners?.length?S.banners:[{title:S.heroTitle,text:S.heroText}];
 banners.forEach((b,i)=>{const el=document.createElement('article');el.className='slide';const copy=document.createElement('div'),ed=document.createElement('div'),h=document.createElement('h1'),p=document.createElement('p');ed.className='edition';ed.textContent=S.edition||'';h.textContent=b.title||S.heroTitle||'';p.textContent=b.text||S.heroText||'';copy.append(ed,h,p);el.append(copy);if(b.image){const im=document.createElement('img');im.src=b.image;im.alt=b.title||'Phone accessories';im.loading=i?'lazy':'eager';el.append(im)}slides.append(el);const dot=document.createElement('button');dot.type='button';dot.setAttribute('aria-label','Show banner '+(i+1));dot.onclick=()=>el.scrollIntoView({behavior:'smooth',inline:'start'});dots.append(dot)});
 const root=$('products');root.innerHTML='';(S.products||[]).forEach((p)=>{const card=document.createElement('article');card.className='product';const src=p.image||(p.media?.[0]?.data)||'';if(src){const im=document.createElement('img');im.src=src;im.alt=p.name||'Phone accessory';im.loading='lazy';card.append(im)}else{const ph=document.createElement('div');ph.className='empty';ph.textContent='PRODUCT IMAGE';card.append(ph)}const c=document.createElement('div'),h=document.createElement('h3'),short=document.createElement('p'),details=document.createElement('details'),summary=document.createElement('summary'),full=document.createElement('p'),price=document.createElement('div'),a=document.createElement('a');h.textContent=p.name||'Phone accessory';short.textContent=p.shortDescription||p.description||'';summary.textContent='View full description';full.className='full';full.textContent=p.description||'';details.append(summary,full);price.className='price';price.textContent='GH₵ '+(p.price||'0.00');a.className='order';a.textContent='ORDER ON WHATSAPP';a.href='https://wa.me/'+encodeURIComponent(S.whatsapp||'233599676419')+'?text='+encodeURIComponent('Hello '+(S.brand||'FMM CLASSICO')+', I would like to order '+(p.name||'this product')+'. Price: GH₵ '+(p.price||'')+'.');a.target='_blank';a.rel='noopener';c.append(h,short,details,price,a);card.append(c);root.append(card)});
 if(!S.products?.length){const msg=document.createElement('p');msg.className='empty';msg.textContent='Products will be displayed here. Please check back soon.';root.append(msg)}}
(async()=>{try{const r=await fetch('/api/catalogue',{cache:'no-store'});if(r.ok)S={...DEFAULTS,...await r.json()}}catch(e){console.warn(e)}render()})();
</script></body></html>
