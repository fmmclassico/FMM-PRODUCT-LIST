<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://4gjdrdzcv2odybbe.public.blob.vercel-storage.com" crossorigin><link rel="dns-prefetch" href="//4gjdrdzcv2odybbe.public.blob.vercel-storage.com"><meta name="theme-color" content="#0878b9"><title>Product details | FMM CLASSICO</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f7;color:#1d2d38;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:20px auto;background:#fff;min-height:90vh;box-shadow:0 8px 30px #07345114}.top{height:9px;background:#0878b9}header{padding:22px 30px;border-bottom:1px solid #e2ebf0}.brand{font-size:26px;font-weight:900;color:#073451;margin:0}.tag{font-size:11px;font-weight:800;letter-spacing:1px;color:#637783;margin:7px 0}.back{display:inline-block;margin:18px 30px;color:#0878b9;text-decoration:none;font-weight:800;font-size:13px}.product{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:30px;padding:0 30px 34px;align-items:start}.gallery{min-width:0}.main-frame{width:100%;min-height:300px;max-height:70vh;display:flex;align-items:center;justify-content:center;background:#f3f8fb;border:1px solid #e2ebf0;border-radius:10px;padding:12px;overflow:hidden}.main-frame img{display:block;max-width:100%;max-height:66vh;width:auto;height:auto;object-fit:contain;object-position:center}.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.thumb{width:82px;height:82px;object-fit:contain;object-position:center;background:#f3f8fb;border:1px solid #d9e6ed;border-radius:7px;padding:3px;cursor:pointer}.thumb[aria-pressed=true]{border:2px solid #0878b9}.info h1{font-size:clamp(24px,4vw,34px);line-height:1.2;color:#073451;margin:2px 0 12px}.price{font-size:25px;font-weight:900;color:#0878b9;margin:14px 0}.short{font-size:15px;line-height:1.7;color:#536975}.description{margin-top:22px;font-size:15px;line-height:1.8;color:#344b58;overflow-wrap:anywhere}.description p{margin:0 0 13px}.description ul{padding-left:22px;margin:8px 0 16px}.description li{padding-left:4px;margin-bottom:8px}.order{display:inline-block;margin-top:14px;background:#0878b9;color:white;text-decoration:none;border-radius:6px;padding:13px 18px;font-size:12px;font-weight:900}.video{width:100%;max-height:420px;margin-top:18px;background:#071b27;border-radius:8px}.empty{padding:40px;text-align:center;color:#637783;background:#f3f8fb;border-radius:8px}.footer{background:#073451;color:white;text-align:center;padding:22px;font-size:13px}@media(max-width:700px){.wrap{margin:0}.product{grid-template-columns:1fr;padding:0 16px 25px;gap:22px}.back{margin:16px}.main-frame{min-height:230px;max-height:58vh}.main-frame img{max-height:54vh}header{padding:20px 16px}.thumb{width:70px;height:70px}.info h1{font-size:25px}}
 .main-frame .image-load-error{display:none}.main-frame:has(.image-load-error)::after{content:'Product image temporarily unavailable';display:flex;align-items:center;justify-content:center;min-height:220px;color:#637783;background:#eaf5fb;padding:20px;border-radius:8px}</style></head><body><main class="wrap"><div class="top"></div><header><p class="brand" id="brand">FMM CLASSICO</p><p class="tag">YOUR TRUSTED DESTINATION FOR QUALITY PRODUCTS</p></header><a class="back" href="/">← Back to catalogue</a><section id="content"><p class="empty">Loading product details…</p></section><footer class="footer">FMM CLASSICO · QUALITY PRODUCTS. AFFORDABLE PRICES.</footer></main>
<script>
const $=id=>document.getElementById(id);
function renderDescription(root,raw){root.replaceChildren();const lines=String(raw||'').replace(/\r\n?/g,'\n').split('\n');let para=[],list=null;const flushP=()=>{if(para.length){const p=document.createElement('p');p.textContent=para.join(' ').trim();root.append(p);para=[]}};const flushL=()=>{if(list){root.append(list);list=null}};for(const line of lines){const t=line.trim();if(!t){flushP();flushL()}else if(/^[-•]\s+/.test(t)){flushP();if(!list)list=document.createElement('ul');const li=document.createElement('li');li.textContent=t.replace(/^[-•]\s+/,'');list.append(li)}else{flushL();para.push(t)}}flushP();flushL()}
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){$('content').innerHTML='<p class="empty">No product was selected. <a href="/">Return to the catalogue</a>.</p>';return}try{const r=await fetch('/api/catalogue',{cache:'no-store'});if(!r.ok)throw Error('Catalogue could not be loaded');const data=await r.json();$('brand').textContent=data.brand||'FMM CLASSICO';const p=(data.products||[]).find(x=>String(x.id)===id&&x.visible!==false);if(!p){$('content').innerHTML='<p class="empty">This product is unavailable or has been removed. <a href="/">Return to the catalogue</a>.</p>';return}
const images=Array.isArray(p.images)&&p.images.length?p.images.filter(Boolean):[p.image||(p.media?.[0]?.data)||''].filter(Boolean);const section=document.createElement('section');section.className='product';const gallery=document.createElement('div');gallery.className='gallery';const frame=document.createElement('div');frame.className='main-frame';const main=document.createElement('img');main.alt=(p.name||'Product')+' image 1';main.width=1200;main.height=1200;main.loading='eager';main.decoding='async';main.fetchPriority='high';let activeImageIndex=0;if(images.length){main.src=images[0];main.addEventListener('error',()=>{activeImageIndex++;if(activeImageIndex<images.length){main.src=images[activeImageIndex];main.alt=(p.name||'Product')+' image '+(activeImageIndex+1)}else{main.removeAttribute('src');main.alt='Product image unavailable';main.classList.add('image-load-error')}});frame.append(main)}else{const empty=document.createElement('div');empty.className='empty';empty.textContent='No product image available';frame.append(empty)}gallery.append(frame);if(images.length>1){const thumbs=document.createElement('div');thumbs.className='thumbs';images.forEach((url,n)=>{const t=document.createElement('img');t.className='thumb';t.src=url;t.alt=(p.name||'Product')+' image '+(n+1);t.width=120;t.height=120;t.loading='lazy';t.decoding='async';t.onerror=()=>{t.style.display='none'};t.setAttribute('role','button');t.tabIndex=0;t.setAttribute('aria-pressed',n===0?'true':'false');const choose=()=>{main.src=url;main.alt=(p.name||'Product')+' image '+(n+1);thumbs.querySelectorAll('.thumb').forEach(x=>x.setAttribute('aria-pressed','false'));t.setAttribute('aria-pressed','true')};t.addEventListener('click',choose);t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}});thumbs.append(t)});gallery.append(thumbs)}if(p.video){const v=document.createElement('video');v.className='video';v.src=p.video;v.controls=true;v.preload='none';v.playsInline=true;gallery.append(v)}
const info=document.createElement('div');info.className='info';const h=document.createElement('h1');h.textContent=p.name||'Phone accessory';const price=document.createElement('div');price.className='price';price.textContent='GH₵ '+(p.price||'0.00');const short=document.createElement('p');short.className='short';short.textContent=p.shortDescription||'';const desc=document.createElement('div');desc.className='description';renderDescription(desc,p.description||'');const order=document.createElement('a');order.className='order';order.textContent='ORDER ON WHATSAPP';order.href='/whatsapp.html?productId='+encodeURIComponent(p.id||'')+'&product='+encodeURIComponent(p.name||'this product')+'&price='+encodeURIComponent(p.price||'');order.target='_blank';order.rel='noopener';info.append(h,price,short,desc,order);section.append(gallery,info);$('content').replaceChildren(section);
}catch(e){$('content').innerHTML='<p class="empty">Unable to load this product right now. Please return to the catalogue and try again.</p>'}})();
</script></body></html>
